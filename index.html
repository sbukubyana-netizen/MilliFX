<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Prevent stale caching of the application shell to ensure instant fresh loads -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="description" content="A private, cinematic streaming-style memory website celebrating Millicent. Featuring photo collections, a personal trailer, a romantic countdown, and live multi-device synchronized love notes and song dedications." />
    <meta property="og:title" content="MilliFix — Cinematic Moments" />
    <meta property="og:description" content="A private, cinematic streaming-style memory website celebrating Millicent. Featuring photo collections, a personal trailer, a romantic countdown, and live multi-device synchronized love notes and song dedications." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
    <link rel="manifest" href="/manifest.json" />
    <title>MilliFix — Cinematic Moments</title>
    <script>
      // Immediate clean boot script: clear stale service workers and CacheStorage to maximize load speed
      (function() {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            }).catch(function() {});
          }
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var i = 0; i < names.length; i++) {
                caches.delete(names[i]);
              }
            }).catch(function() {});
          }
        } catch (e) {}
      })();

      // Self-healing asset loading error handling:
      // If the browser tries to load a stale/deleted chunk, refresh gracefully
      window.addEventListener('error', function(e) {
        var target = e.target;
        if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
          var url = target.src || target.href;
          if (url && (url.indexOf('assets/') !== -1 || url.indexOf('index-') !== -1 || url.indexOf('.js') !== -1 || url.indexOf('.css') !== -1)) {
            console.warn('Asset failed to load: ' + url + '. Refreshing page to fetch latest build...');
            
            var reloadCount = sessionStorage.getItem('millifix_asset_reload_count') || '0';
            var count = parseInt(reloadCount, 10);
            if (count < 2) {
              sessionStorage.setItem('millifix_asset_reload_count', (count + 1).toString());
              
              if ('caches' in window) {
                caches.keys().then(function(keys) {
                  for (var i = 0; i < keys.length; i++) {
                    caches.delete(keys[i]);
                  }
                });
              }
              
              setTimeout(function() {
                window.location.reload();
              }, 200);
            }
          }
        }
      }, true);
      
      // Reset the reload counter when the app successfully mounts
      window.addEventListener('load', function() {
        setTimeout(function() {
          try {
            sessionStorage.removeItem('millifix_asset_reload_count');
          } catch (e) {}
        }, 1000);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
